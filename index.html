</script><script>const E=[{"id": "e0", "year": -3250, "title": "Hieroglyphic writing develops", "person": "Egyptian scribes", "category": "Inventions", "story": "Early Egyptian communities needed ways to record important information. Signs became a writing system used by scribes.", "result": "Hieroglyphs were used for more than 3,600 years.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e1", "year": -3100, "title": "Upper and Lower Egypt united", "person": "Narmer", "category": "Rulers", "story": "The Nile valley contained Upper and Lower Egypt. Early kings extended their power over both regions.", "result": "Narmer was among the first kings to rule both; the date is approximate.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e2", "year": -2700, "title": "A quicker script", "person": "Egyptian scribes", "category": "Inventions", "story": "Writing detailed hieroglyphic signs took time. Everyday records called for a faster method.", "result": "Hieratic, a cursive script, was fully developed by about 2700 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e3", "year": -2550, "title": "Pyramids rise at Giza", "person": "Khafre", "category": "Architecture", "story": "Old Kingdom rulers built monumental tombs. At Giza, royal building projects produced three enormous pyramids.", "result": "The Giza pyramids were built in 2600–2500 BCE; 2550 is a timeline midpoint.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e4", "year": -2055, "title": "Egypt reunited", "person": "Mentuhotep II", "category": "Rulers", "story": "After central government collapsed, different rulers controlled Upper and Lower Egypt. A king from Thebes rebuilt unity.", "result": "Mentuhotep II became king of Upper Egypt around 2055 BCE and later ruled all Egypt.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e5", "year": -1860, "title": "Senusret III rules", "person": "Senusret III", "category": "Rulers", "story": "Middle Kingdom kings strengthened their territory and royal authority. Senusret III expanded the lands under Egyptian rule.", "result": "His reign is associated with wealth and power; the timeline date is approximate.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e6", "year": -1799, "title": "A woman takes the throne", "person": "Neferusobek", "category": "Rulers", "story": "Egyptian kingship was usually held by men, but women also ruled. Neferusobek held the throne near the end of the Middle Kingdom.", "result": "She was one of the earliest female rulers; her reign was about 1799–1795 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e7", "year": -1700, "title": "Book of the Dead", "person": "Egyptian scribes", "category": "Religion", "story": "Egyptians believed the dead needed protection on their journey to the afterlife. Spells were collected for that purpose.", "result": "The Book of the Dead began to be used around 1700 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e8", "year": -1550, "title": "Hyksos rule ends", "person": "Ahmose", "category": "Wars", "story": "The Hyksos controlled Lower Egypt while Egyptian rulers held the south. Ahmose fought to bring the regions together.", "result": "Around 1550 BCE he defeated the Hyksos and became king of all Egypt.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e9", "year": -1473, "title": "Hatshepsut becomes pharaoh", "person": "Hatshepsut", "category": "Rulers", "story": "Thutmose III was too young to rule. Hatshepsut first governed in his place and became pharaoh herself.", "result": "She ruled about 1473–1458 BCE and built a famous temple opposite Thebes.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e10", "year": -1352, "title": "Akhenaten promotes Aten", "person": "Akhenaten", "category": "Religion", "story": "Egypt worshipped many gods. Akhenaten promoted the sun disc Aten and discouraged other cults.", "result": "After his death, the earlier religious order was restored; his reign began about 1352 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e11", "year": -1336, "title": "Tutankhamun becomes king", "person": "Tutankhamun", "category": "Rulers", "story": "After the upheaval associated with Akhenaten, a young king inherited the throne. Tutankhamun was about nine.", "result": "His nearly intact tomb, found in 1922, later revealed many royal objects.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e12", "year": -1279, "title": "Ramses II begins his reign", "person": "Ramses II", "category": "Rulers", "story": "New Kingdom pharaohs controlled large territories. Ramses II used extensive building projects to display his power.", "result": "He ruled for 66 years, about 1279–1213 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e13", "year": -525, "title": "Persian rule in Egypt", "person": "Persian rulers", "category": "Empires", "story": "Egypt increasingly faced powerful neighbouring empires. Persian conquest replaced independent Egyptian rule.", "result": "Persia ruled Egypt from 525–404 BCE and again from 343–332 BCE.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e14", "year": -332, "title": "Alexander conquers Egypt", "person": "Alexander the Great", "category": "Empires", "story": "Alexander expanded his conquests into Egypt. After his death, a general established a new ruling family.", "result": "Ptolemy I and his descendants ruled Egypt for about 300 years.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e15", "year": -196, "title": "Rosetta Stone decree", "person": "Ptolemy V", "category": "Language", "story": "Egyptian priests and Ptolemy V made an agreement. It was written in scripts understood by different readers.", "result": "The decree appears in hieroglyphs, demotic and Greek.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e16", "year": -51, "title": "Cleopatra VII rules", "person": "Cleopatra VII", "category": "Rulers", "story": "The Ptolemaic dynasty governed a kingdom increasingly entangled with Roman power. Cleopatra became its last independent ruler.", "result": "Her reign lasted 51–30 BCE; after defeat by Octavian, Egypt became Roman.", "era": "Egypt", "country": "Egypt", "source": "https://www.britishmuseum.org/learn/schools/ages-7-11/ancient-egypt/timeline-ancient-egypt", "publisher": "British Museum", "displayDate": ""}, {"id": "e17", "year": -776, "title": "First recorded Olympic Games", "person": "Greek athletes", "category": "Culture", "story": "Greek communities held religious festivals and athletic contests. Olympia became the home of a famous recurring competition.", "result": "776 BCE is the traditional date of the first recorded Olympic Games.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e18", "year": -508, "title": "Athenian democratic reforms", "person": "Cleisthenes", "category": "Politics", "story": "Athens had experienced powerful aristocrats and tyrants. Cleisthenes reorganized its political institutions.", "result": "His reforms around 508 BCE helped establish democracy, but citizenship excluded women, enslaved people and foreigners.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e19", "year": -490, "title": "Battle of Marathon", "person": "Greek hoplites", "category": "Wars", "story": "Persian expansion brought an invasion of mainland Greece. Greek defenders met the invading army at Marathon.", "result": "Greek hoplites defeated the Persians in 490 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e20", "year": -480, "title": "Battle of Salamis", "person": "Themistocles", "category": "Wars", "story": "Xerxes invaded Greece with land and naval forces. The Athenians had expanded their fleet.", "result": "The Greek fleet defeated the Persian armada at Salamis.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e21", "year": -478, "title": "Delian League formed", "person": "Athens", "category": "Empires", "story": "Greek cities cooperated against Persia. An alliance led by Athens grew into a source of Athenian power.", "result": "The Delian League lasted from 478–404 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e22", "year": -447, "title": "Parthenon construction begins", "person": "Phidias", "category": "Architecture", "story": "Athens used its wealth for major public buildings. Artists and architects worked on its Acropolis.", "result": "Construction of the Parthenon ran from 447–432 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e23", "year": -431, "title": "Peloponnesian War begins", "person": "Athens and Sparta", "category": "Wars", "story": "Athens and Sparta led rival alliances. Their competition became a prolonged conflict involving much of Greece.", "result": "The war lasted 431–404 BCE and ended in Athenian defeat.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e24", "year": -399, "title": "Trial of Socrates", "person": "Socrates", "category": "Ideas", "story": "Socrates questioned people about truth and right conduct. His teaching became controversial in Athens.", "result": "He was tried and died in 399 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e25", "year": -380, "title": "Plato founds the Academy", "person": "Plato", "category": "Ideas", "story": "Plato continued philosophical inquiry after Socrates. He created a place for study outside Athens.", "result": "The Academy was founded around 380 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e26", "year": -343, "title": "Aristotle tutors Alexander", "person": "Aristotle", "category": "Education", "story": "Philip II wanted an education for his son. He invited the philosopher Aristotle to teach Alexander.", "result": "The future conqueror was tutored by Aristotle from around 343 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e27", "year": -336, "title": "Alexander becomes king", "person": "Alexander the Great", "category": "Rulers", "story": "Philip II had expanded Macedonian power. Alexander succeeded him on the throne.", "result": "Alexander reigned from 336–323 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e28", "year": -334, "title": "Alexander invades Persia", "person": "Alexander the Great", "category": "Empires", "story": "With Macedonian power established in Greece, Alexander crossed into the Persian Empire.", "result": "The campaign began in 334 BCE and spread Greek influence over a large region.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e29", "year": -323, "title": "Hellenistic age begins", "person": "Alexander the Great", "category": "Culture", "story": "Alexander died after creating a vast empire. Greek culture mixed with local traditions across its former territories.", "result": "The Hellenistic period is conventionally dated 323–31 BCE.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e30", "year": -146, "title": "Rome sacks Corinth", "person": "Roman forces", "category": "Empires", "story": "Rome expanded into the Greek world and confronted the Achaean League.", "result": "Corinth was sacked in 146 BCE and Roman control increased.", "era": "Greece", "country": "Greece", "source": "https://www.worldhistory.org/timeline/greece/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e31", "year": -27, "title": "Augustus, first emperor", "person": "Augustus", "category": "Rulers", "story": "Civil wars weakened the Roman Republic. Octavian emerged as the leading ruler and received a new title from the Senate.", "result": "In 27 BCE he became Augustus; this marks the conventional start of the Roman Empire.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e32", "year": 43, "title": "Claudius invades Britain", "person": "Claudius", "category": "Empires", "story": "Roman emperors sought new territories. Claudius began a major campaign across the Channel.", "result": "Rome invaded Britain in 43 CE.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e33", "year": 68, "title": "End of Nero’s dynasty", "person": "Nero", "category": "Rulers", "story": "Nero lost political support and was declared a public enemy. His death left rival commanders competing for power.", "result": "His death in 68 CE led into the Year of the Four Emperors.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e34", "year": 98, "title": "Trajan becomes emperor", "person": "Trajan", "category": "Rulers", "story": "After Nerva, Trajan inherited imperial authority. His military campaigns expanded Roman territory.", "result": "Trajan reigned from 98–117 CE.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e35", "year": 117, "title": "Hadrian begins his reign", "person": "Hadrian", "category": "Rulers", "story": "Trajan’s expansion left a huge empire to govern. Hadrian travelled widely through its provinces.", "result": "Hadrian reigned from 117–138 CE.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e36", "year": 212, "title": "Citizenship extended", "person": "Caracalla", "category": "Law", "story": "Roman citizenship carried legal status and had not belonged to all provincial people. An imperial edict broadened it.", "result": "Caracalla granted citizenship to free inhabitants of the empire, not enslaved people.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e37", "year": 285, "title": "Imperial administration divided", "person": "Diocletian", "category": "Politics", "story": "Rome’s territory was difficult for one ruler to manage. Diocletian reorganized imperial government.", "result": "Eastern and western administration developed; this was not the sudden end of one unified culture.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e38", "year": 313, "title": "Christianity legalized", "person": "Constantine", "category": "Religion", "story": "Christians had faced periods of persecution. Constantine’s era changed their legal position.", "result": "Christianity became legally tolerated; it did not instantly become the sole religion.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e39", "year": 410, "title": "Sack of Rome", "person": "Alaric", "category": "Wars", "story": "Western imperial power weakened while armed groups moved through its territory. Rome still held enormous symbolic importance.", "result": "Visigoths under Alaric sacked Rome in 410 CE.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e40", "year": 476, "title": "Western imperial rule ends", "person": "Romulus Augustulus", "category": "Empires", "story": "Political instability, economic strains and invasions weakened the western empire. Its last emperor was removed.", "result": "476 CE is the conventional end of the Western Roman Empire; the Eastern empire continued.", "era": "Rome", "country": "Italy", "source": "https://www.worldhistory.org/Roman_Empire/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e41", "year": 1095, "title": "Urban II calls for a crusade", "person": "Urban II", "category": "Religion", "story": "Byzantine emperor Alexios I sought western military help against the Seljuks. Urban II combined that appeal with a campaign for Jerusalem.", "result": "The First Crusade drew together religious, political and personal motives.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e42", "year": 1099, "title": "Jerusalem captured", "person": "First Crusaders", "category": "Wars", "story": "After a long journey and sieges, crusading armies reached Jerusalem.", "result": "They captured the city in July 1099; the conquest included mass killing of its inhabitants.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e43", "year": 1144, "title": "Edessa falls", "person": "Zangi", "category": "Wars", "story": "Crusader states struggled with limited manpower and rivalry. Zangi captured Edessa.", "result": "The loss helped prompt the Second Crusade.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e44", "year": 1147, "title": "Second Crusade begins", "person": "Louis VII", "category": "Wars", "story": "The fall of Edessa alarmed western Christian rulers. Louis VII and Conrad III led a new expedition.", "result": "The campaign failed, including an unsuccessful siege of Damascus.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e45", "year": 1187, "title": "Hattin and Jerusalem", "person": "Saladin", "category": "Wars", "story": "Saladin united substantial power in Egypt and Syria. He defeated a Crusader army at Hattin.", "result": "He then took Jerusalem, prompting another crusade.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e46", "year": 1189, "title": "Third Crusade begins", "person": "Richard I", "category": "Wars", "story": "The loss of Jerusalem brought western kings and an emperor into a new campaign.", "result": "Richard I, Philip II and Frederick Barbarossa were its leading rulers.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e47", "year": 1192, "title": "Pilgrim access treaty", "person": "Richard I and Saladin", "category": "Treaties", "story": "The Third Crusade did not recapture Jerusalem. Negotiation offered a way to end the fighting.", "result": "The settlement allowed Christian pilgrims access and left a coastal foothold around Acre.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e48", "year": 1204, "title": "Constantinople sacked", "person": "Fourth Crusaders", "category": "Wars", "story": "Financial interests and tensions between eastern and western Christians diverted the Fourth Crusade.", "result": "Crusaders sacked a Christian city and divided Byzantine territory.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e49", "year": 1229, "title": "Treaty of Jaffa", "person": "Frederick II and al-Kamil", "category": "Treaties", "story": "Frederick II sought Jerusalem while al-Kamil faced problems within his own realm. Both had reasons to negotiate.", "result": "An agreement transferred control of Jerusalem while allowing Muslim pilgrim access.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e50", "year": 1250, "title": "Louis IX captured", "person": "Louis IX", "category": "Wars", "story": "Crusaders again tried to reach the Holy Land through Egypt. The expedition repeated an earlier failed strategy.", "result": "Louis IX was captured after defeat and later ransomed.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e51", "year": 1270, "title": "Eighth Crusade ends", "person": "Louis IX", "category": "Wars", "story": "Louis IX launched another North African expedition, this time against Tunis. Disease struck the army.", "result": "The king died and the crusade was abandoned.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e52", "year": 1291, "title": "Fall of Acre", "person": "Mamluk forces", "category": "Empires", "story": "The Mamluks expanded their control while Crusader territory shrank. Acre was the last major stronghold.", "result": "Its fall ended the principal Crusader states in the Levant.", "era": "Crusades", "country": "Regional", "source": "https://www.worldhistory.org/Crusades/", "publisher": "World History Encyclopedia", "displayDate": ""}, {"id": "e53", "year": 1066, "title": "Norman conquest", "person": "William I", "category": "Rulers", "story": "Rival claims to England’s throne led to invasion. William defeated Harold at Hastings.", "result": "William became king and Norman rule reshaped England.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e54", "year": 1085, "title": "Domesday survey ordered", "person": "William I", "category": "Politics", "story": "The crown needed detailed knowledge of English landholding and resources.", "result": "A nationwide survey was ordered in 1085, producing the Domesday Book.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e55", "year": 1154, "title": "Henry II becomes king", "person": "Henry II", "category": "Rulers", "story": "A new royal reign connected England with a wide network of continental lands.", "result": "Henry II ruled from 1154–1189.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e56", "year": 1170, "title": "Thomas Becket killed", "person": "Thomas Becket", "category": "Religion", "story": "Relations between royal and church authority could be tense. Becket’s conflict with the crown made him a central figure.", "result": "He was killed at Canterbury Cathedral in 1170.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e57", "year": 1215, "title": "Magna Carta", "person": "King John", "category": "Law", "story": "King John faced opposition from barons. A charter set out restraints and obligations for royal government.", "result": "Magna Carta was issued in 1215; it was not universal democracy.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e58", "year": 1314, "title": "Bannockburn", "person": "Robert the Bruce", "category": "Wars", "story": "Scotland’s kingship and independence were contested. Robert the Bruce confronted Edward II’s army.", "result": "Bruce defeated Edward II at Bannockburn.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e59", "year": 1337, "title": "Hundred Years’ War begins", "person": "English and French rulers", "category": "Wars", "story": "Rival royal claims and territorial interests drew England and France into prolonged conflict.", "result": "The Hundred Years’ War began in 1337.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e60", "year": 1347, "title": "Black Death reaches Europe", "person": "European communities", "category": "Disease", "story": "Connected routes carried people and goods, but also disease. Plague devastated communities.", "result": "A major European wave ran from 1347–1350; populations and economies were transformed.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e61", "year": 1381, "title": "Peasants’ Revolt", "person": "Wat Tyler", "category": "Revolutions", "story": "Late medieval England experienced social and fiscal pressures. Protesters challenged authority.", "result": "Wat Tyler led the English Peasants’ Revolt in 1381.", "era": "Medieval", "country": "United Kingdom", "source": "https://web.stanford.edu/~regawood/timeline.html", "publisher": "Stanford medieval seminar", "displayDate": ""}, {"id": "e62", "year": 1419, "title": "Florence dome design", "person": "Brunelleschi", "category": "Architecture", "story": "Italian cities funded ambitious public buildings. Florence’s cathedral required a huge dome.", "result": "Brunelleschi designed its celebrated dome.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e63", "year": 1434, "title": "Medici power in Florence", "person": "Medici family", "category": "Rulers", "story": "Wealthy families influenced Italian city politics and paid for art.", "result": "The Medici became the leading family in Florence.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e64", "year": 1469, "title": "Lorenzo leads Florence", "person": "Lorenzo de’ Medici", "category": "Culture", "story": "Medici wealth supported artists as well as political influence. Lorenzo continued that patronage.", "result": "He became head of Florence and a major supporter of the arts.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e65", "year": 1495, "title": "The Last Supper", "person": "Leonardo da Vinci", "category": "Art", "story": "Renaissance patrons commissioned artists for religious and civic works. Leonardo explored how to depict people and space.", "result": "He began The Last Supper around 1495.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e66", "year": 1501, "title": "David sculpture begins", "person": "Michelangelo", "category": "Art", "story": "Florence’s artists competed to create major works. Michelangelo worked on a monumental figure.", "result": "He began David in 1501.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e67", "year": 1503, "title": "Mona Lisa begins", "person": "Leonardo da Vinci", "category": "Art", "story": "Renaissance artists studied human expression and lifelike portraits. Leonardo developed a famous portrait project.", "result": "Work on the Mona Lisa began around 1503; completion dating is less precise.", "era": "Renaissance", "country": "Italy", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.ph ": "Religion", "story": "Henry sought to end his marriage and faced resistance from Rome. Royal and religious authority came into conflict.", "result": "England’s church separated from Roman Catholic authority.", "era": "Renaissance", "country": "United Kingdom", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e77", "year": 1558, "title": "Elizabeth I becomes queen", "person": "Elizabeth I", "category": "Rulers", "story": "England had undergone repeated changes in monarch and religion. Elizabeth inherited the throne.", "result": "Her reign began in 1558.", "era": "Renaissance", "country": "United Kingdom", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e78", "year": 1588, "title": "Spanish Armada defeated", "person": "Elizabeth I", "category": "Wars", "story": "England and Spain were rivals. Spain sent an invasion fleet.", "result": "The Armada was defeated in 1588.", "era": "Renaissance", "country": "United Kingdom", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e79", "year": 1599, "title": "Globe theatre opens", "person": "William Shakespeare", "category": "Culture", "story": "Public theatre drew growing audiences in London. Shakespeare’s company needed a stage.", "result": "The Globe became a home for many of his plays.", "era": "Renaissance", "country": "United Kingdom", "source": "https://www.ducksters.com/history/renaissance/timeline_of_the_renaissance.php", "publisher": "Ducksters Renaissance timeline", "displayDate": ""}, {"id": "e80", "year": 1438, "title": "Gutenberg’s type mold", "person": "Johannes Gutenberg", "category": "Inventions", "story": "Printing demanded repeatable letters. A mold allowed metal line_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e89", "year": 1809, "title": "Wagram", "person": "Napoleon Bonaparte", "category": "Wars", "story": "Austria again fought the French Empire. Napoleon’s army met Austrian forces near Vienna.", "result": "French victory at Wagram ended the Fifth Coalition’s campaign.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e90", "year": 1812, "title": "Disaster in Russia", "person": "Napoleon Bonaparte", "category": "Wars", "story": "Napoleon invaded Russia at the height of his power. The campaign reached Moscow but could not secure a lasting victory.", "result": "The retreat severely weakened the French army.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e91", "year": 1813, "title": "Battle of Leipzig", "person": "Coalition armies", "category": "Wars", "story": "After the Russian disaster, Napoleon faced renewed coalition pressure. Several armies converged in Germany.", "result": "Defeat at Leipzig helped undo French dominance.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e92", "year": 1814, "title": "Napoleon exiled to Elba", "person": "Napoleon Bonaparte", "category": "Rulers", "story": "Coalition victories made his position untenable. Napoleon abdicated.", "result": "He was sent to Elba and the Bourbon monarchy returned.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e93", "year": 1815, "title": "Waterloo", "person": "Napoleon Bonaparte", "category": "Wars", "story": "Napoleon escaped Elba and returned to power. Coalition forces confronted him again.", "result": "Defeat at Waterloo ended his return and led to exile on Saint Helena.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e94", "year": 1830, "title": "July Revolution", "person": "Louis Philippe", "category": "Revolutions", "story": "Bourbon rule faced renewed opposition. An uprising replaced the ruling house.", "result": "Louis Philippe became king under the July Monarchy.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e95", "year": 1848, "title": "Second Republic", "person": "French republicans", "category": "Revolutions", "story": "Opposition to monarchy again filled the streets of Paris. Louis Philippe abdicated.", "result": "A republic replaced the monarchy in February 1848.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e96", "year": 1905, "title": "Church-state separation", "person": "French legislature", "category": "Law", "story": "France debated the relationship between religion and public authority.", "result": "The 1905 law ended government funding of religious groups.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e97", "year": 1951, "title": "Coal and steel treaty", "person": "Six European states", "category": "Treaties", "story": "Former European enemies sought stable economic and diplomatic ties after war.", "result": "The Treaty of Paris created the European Coal and Steel Community.", "era": "Revolutions", "country": "France", "source": "https://en.wikipedia.org/wiki/Timeline_of_French_history", "publisher": "French history timeline", "displayDate": ""}, {"id": "e98", "year": -1600, "title": "Shang dynasty", "person": "Shang rulers", "category": "Empires", "story": "Early states developed writing, bronze technology and walled cities.", "result": "The Shang period began around 1600 BCE; ancient dates remain approximate.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e99", "year": -1046, "title": "Zhou dynasty", "person": "Zhou rulers", "category": "Empires", "story": "The Zhou royal house organized power through aristocratic families and ancestral ties.", "result": "The Zhou dynasty began around 1046 BCE.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e100", "year": -551, "title": "Confucius is born", "person": "Confucius", "category": "Ideas", "story": "Competition between semi-autonomous states weakened the old political order. Thinkers considered how society should be governed.", "result": "Confucius lived about 551–479 BCE.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e101", "year": -221, "title": "Qin unifies China", "person": "Qin Shihuangdi", "category": "Empires", "story": "The Warring States competed for dominance. Qin created a centralized state.", "result": "Qin standardized script, weights and measures and ruled harshly.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, { _timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e111", "year": 1912, "title": "Republic of China", "person": "Republican leaders", "category": "Revolutions", "story": "The imperial system ended after centuries of dynastic government. A republic replaced it.", "result": "The Republic period followed Qing rule.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e112", "year": 1949, "title": "People’s Republic founded", "person": "Communist leaders", "category": "Politics", "story": "A long period of conflict ended with a new government controlling mainland China.", "result": "The People’s Republic of China was established in 1949.", "era": "Empires", "country": "China", "source": "https://afe.easia.columbia.edu/timelines/china_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e113", "year": 552, "title": "Buddhism introduced", "person": "Japanese court", "category": "Religion", "story": "Religious and cultural exchanges linked Japan to the Asian continent.", "result": "This timeline dates Buddhism’s introduction to 552; other chronologies use 538.", "era": "Empires", "country": "Japan", "source": "https://afe.easia.columbia.edu/timelines/japan_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e114", "year": 645, "title": "Taika reforms", "person": "Japanese court", "category": "Politics", "story": "Leaders drew on ideas from China about law, writing and bureaucracy.", "result": "The Taika reforms reorganized government.", "era": "Empires", "country": "Japan", "source": "https://afe.easia.columbia.edu/timelines/japan_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e115", "year": 710, "title": "Nara capital", "person": "Imperial der the Meiji government.", "era": "Empires", "country": "Japan", "source": "https://afe.easia.columbia.edu/timelines/japan_timeline.htm", "publisher": "Columbia University, Asia for Educators", "displayDate": ""}, {"id": "e120", "year": 1600, "title": "Sekigahara", "person": "Tokugawa Ieyasu", "category": "Wars", "story": "Rivals competed after Japan’s reunification campaigns. Ieyasu defeated western opponents.", "result": "Victory at Sekigahara secured his power.", "era": "Empires", "country": "Japan", "source": "https://www.japan-guide.com/e/e2128.html", "publisher": "Japan Guide", "displayDate": ""}, {"id": "e121", "year": 1603, "title": "Edo shogunate", "person": "Tokugawa Ieyasu", "category": "Rulers", "story": "With military dominance secured, Ieyasu received the title of shogun.", "result": "He established his government in Edo, present-day Tokyo.", "era": "Empires", "country": "Japan", "source": "https://www.japan-guide.com/e/e2128.html", "publisher": "Japan Guide", "displayDate": ""}, {"id": "e122", "year": 1639, "title": "Foreign contacts restricted", "person": "Tokugawa shoguns", "category": "Trade", "story": "The shogunate tightly controlled foreign influence and travel.", "result": "Trade continued through selected routes, including China and the Netherlands; Japan was not completely sealed off.", "era": "Empires", "country": "Japan", "source": "https://www.japan-guide.com/e/e2128.html", "publisher": "Japan Guide", "displayDate": ""}, {"id": "e123", "year": 1720, "title": "Western book ban relaxed", "person": "Tokugawa government", "category": "Education", "story": "Restrictions had limited imported learning. A change allowed more foreign knowledge to circulate.", "result": "Dutch Learning and other schools of thought grew.", "era": "Empires", "country": "Japan", "source": "https://www.japan-guide.com/e/e2128.html", "publisher": "Japan Guide", "displayDate": ""}, {"id": "e124", "year": 1853, "title": "Perry arrives", "person": "Commodore Perry", "category": "Trade", "story": "Foreign powers increasingly pressured Japan to open ports. A US fleet forced the issue.", "result": "Limited port opening followed in 1854, before wider changes under Meiji.", "era": "Empires", "country": "Japan", "source": "https://www.japan-guide.com/e/e2128.html", "publisher": "Japan Guide", "displayDate": ""}, {"id": "e125", "year": 1526, "title": "Mughal rule begins", "person": "Babur", "category": "Empires", "story": "Northern India’s ruling powers faced a new challenger. Babur defeated Ibrahim Lodi at Panipat.", "result": "The battle established Mughal rule.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e126", "year": 1600, "title": "East India Company charter", "person": "Elizabeth I", "category": "Trade", "story": "English merchants sought organized trade with Asia. A royal charter created a company.", "result": "The East India Company began as a trading enterprise, before later territorial rule.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e127", "year": 1857, "title": "Revolt against Company rule", "person": "Indian rebels", "category": "Revolutions", "story": "Company rule faced a major armed revolt involving soldiers and other groups.", "result": "The revolt was followed by the end of Company government in 1858.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e128", "year": 1885, "title": "Congress founded", "person": "A. O. Hume", "category": "Politics", "story": "Political organization provided a forum for demands about India’s government.", "result": "The Indian National Congress was founded in Mumbai.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e129", "year": 1905, "title": "Partition of Bengal", "person": "Lord Curzon", "category": "Politics", "story": "British administration divided Bengal. Opponents responded with boycott and Swadeshi movements.", "result": "The partition helped mobilize organized political resistance.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e130", "year": 1930, "title": "Salt March", "person": "Mahatma Gandhi", "category": "Revolutions", "story": "British salt laws became a target for civil disobedience. Gandhi led a march to break the law.", "result": "The Dandi March helped launch a wider civil disobedience campaign.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e131", "year": 1947, "title": "Independence and partition", "person": "Indian independence movement", "category": "Politics", "story": "Decades of struggle and wartime changes put pressure on British rule.", "result": "Independence came on 15 August amid partition, displacement and violence.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e132", "year": 1950, "title": "Republic of India", "person": "Constituent Assembly", "category": "Law", "story": "An independent country needed its constitutional framework.", "result": "India became a republic on 26 January 1950, a different milestone from independence.", "era": "Empires", "country": "India", "source": "https://rrb.iitk.ac.in/sathee-railway-exams/student-corner/quick-revision/gk/gk-indian-history-timeline/", "publisher": "IIT Kanpur SATHEE", "displayDate": ""}, {"id": "e133", "year": 1776, "title": "Declaration of Independence", "person": "Continental Congress", "category": "Revolutions", "story": "Colonists challenged British government and listed grievances against the king.", "result": "The Declaration announced independence but its equality claim did not end slavery or political exclusion.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e134", "year": 1783, "title": "Treaty of Paris", "person": "American negotiators", "category": "Treaties", "story": "The war for independence moved toward a negotiated settlement.", "result": "The Treaty of Paris formally ended the war and recognized US independence.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e135", "year": 1787, "title": "Constitution signed", "person": "Constitutional Convention", "category": "Law", "story": "Delegates met to revise the Articles of Confederation. They instead created a new framework.", "result": "The Constitution was signed in 1787; ratification followed.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e136", "year": 1789, "title": "Washington inaugurated", "person": "George Washington", "category": "Rulers", "story": "The new constitutional government needed its first president.", "result": "George Washington delivered his first inaugural address in 1789.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e137", "year": 1791, "title": "Bill of Rights", "person": "US Congress", "category": "Law", "story": "Debates over the Constitution raised concerns about individual freedoms.", "result": "The first ten amendments became the Bill of Rights.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e138", "year": 1803, "title": "Louisiana Purchase", "person": "Thomas Jefferson", "category": "Treaties", "story": "France and the United States negotiated over a vast territory.", "result": "The Louisiana Purchase greatly expanded US territory, affecting peoples already living there.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e139", "year": 1863, "title": "Emancipation Proclamation", "person": "Abraham Lincoln", "category": "Law", "story": "Civil war created a struggle over slavery and the Union. Lincoln used presidential war powers.", "result": "The proclamation applied to areas in rebellion, not every enslaved person; nationwide abolition followed later.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e140", "year": 1865, "title": "Thirteenth Amendment", "person": "US Congress", "category": "Law", "story": "The proclamation alone could not abolish slavery throughout the country. A constitutional change was needed.", "result": "The Thirteenth Amendment abolished slavery, with an exception for punishment after conviction.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e141", "year": 1920, "title": "Nineteenth Amendment", "person": "Women’s suffrage movement", "category": "Rights", "story": "Campaigners had fought for women’s voting rights over many decades.", "result": "The amendment banned denial of voting rights based on sex; other barriers still excluded many women.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e142", "year": 1964, "title": "Civil Rights Act", "person": "Civil rights movement", "category": "Rights", "story": "Activists challenged segregation and discrimination. Federal legislation followed years of pressure.", "result": "The Act outlawed segregation in public accommodations and banned employment discrimination.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e143", "year": 1965, "title": "Voting Rights Act", "person": "Civil rights movement", "category": "Rights", "story": "Discriminatory barriers continued to block voters despite constitutional guarantees.", "result": "The Voting Rights Act created stronger federal protection.", "era": "Revolutions", "country": "United States", "source": "https://www.archives.gov/milestone-documents/list", "publisher": "US National Archives", "displayDate": ""}, {"id": "e144", "year": 1914, "title": "First World War begins", "person": "European governments", "category": "Wars", "story": "Nationalism, militarism, imperial rivalry and alliances formed the background to a diplomatic crisis after Franz Ferdinand’s assassination.", "result": "Decisions by governments escalated a regional crisis into a world war.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/how-the-world-went-to-war-in-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e145", "year": 1917, "title": "Russian Civil War begins", "person": "Rival Russian forces", "category": "Revolutions", "story": "Revolution and the collapse of imperial authority left competing forces fighting over Russia’s future.", "result": "The civil war is dated 1917–1922 by IWM.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/first-world-war/timeline-of-conflict-since-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e146", "year": 1936, "title": "Spanish Civil War begins", "person": "Spanish factions", "category": "Wars", "story": "Political conflict inside Spain became an armed struggle that also drew foreign involvement.", "result": "The Spanish Civil War lasted 1936–1939.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/first-world-war/timeline-of-conflict-since-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e147", "year": 1947, "title": "Cold War period", "person": "United States and Soviet Union", "category": "Politics", "story": "The wartime alliance gave way to rivalry between powerful states and their allies.", "result": "IWM dates the Cold War 1947–1991; boundaries vary by historian.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/first-world-war/timeline-of-conflict-since-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e148", "year": 1950, "title": "Korean War begins", "person": "Korean and international forces", "category": "Wars", "story": "A divided Korea became the site of a major international conflict.", "result": "The Korean War lasted 1950–1953; an armistice did not create a peace treaty.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/first-world-war/timeline-of-conflict-since-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e149", "year": 1955, "title": "Vietnam War period", "person": "Vietnamese and international forces", "category": "Wars", "story": "Conflict over Vietnam’s future became entangled with decolonization and Cold War rivalry.", "result": "IWM uses 1955–1975 for the Vietnam War; period boundaries can vary.", "era": "Wars", "country": "Regional", "source": "https://www.iwm.org.uk/history/first-world-war/timeline-of-conflict-since-1914", "publisher": "Imperial War Museums", "displayDate": ""}, {"id": "e150", "year": 1931, "title": "Japan invades Manchuria", "person": "Imperial Japan", "category": "Empires", "story": "Japanese expansion targeted territory and influence in East Asia.", "result": "The invasion of Manchuria preceded the European war by eight years.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e151", "year": 1937, "title": "War expands in China", "person": "Imperial Japan", "category": "Wars", "story": "Conflict between Japan and China escalated into a wider invasion.", "result": "War in China began before the conventional 1939 European start date.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e152", "year": 1938, "title": "Munich Agreement", "person": "European governments", "category": "Treaties", "story": "Nazi Germany demanded the Sudetenland. Britain and France tried negotiation to avoid war.", "result": "The agreement forced Czechoslovakia to cede territory and key defences.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e153", "year": 1939.64, "title": "Nazi-Soviet pact", "person": "Hitler and Stalin", "category": "Treaties", "story": "Germany and the Soviet Union negotiated a non-aggression agreement. A secret protocol divided spheres of influence.", "result": "The August pact preceded the invasion and division of Poland.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e154", "year": 1939.67, "title": "Poland invaded", "person": "Nazi Germany", "category": "Wars", "story": "Aggressive expansion had dismantled earlier settlements. Germany attacked Poland on 1 September.", "result": "Britain and France declared war two days later; the Soviet Union invaded from the east on 17 September.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e155", "year": 1940.4, "title": "France and Low Countries attacked", "person": "German forces", "category": "Wars", "story": "After Poland, Germany opened a major western offensive.", "result": "France signed an armistice in June; a collaborationist government operated at Vichy.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e156", "year": 1940.6, "title": "Battle of Britain", "person": "RAF and Luftwaffe", "category": "Wars", "story": "After France’s defeat, Germany fought for air superiority over Britain.", "result": "The air campaign ended in German defeat, from July to October 1940.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e157", "year": 1941.47, "title": "Operation Barbarossa", "person": "Nazi Germany", "category": "Wars", "story": "Germany broke its non-aggression agreement with the Soviet Union and attacked in June.", "result": "The invasion opened an enormous eastern front and intensified Nazi persecution and genocide.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e158", "year": 1941.93, "title": "Pearl Harbor attacked", "person": "Imperial Japan", "category": "Wars", "story": "The Pacific conflict expanded when Japan attacked the US naval base.", "result": "The United States declared war on Japan the following day.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e159", "year": 1942.45, "title": "Battle of Midway", "person": "US Navy", "category": "Wars", "story": "Japanese naval forces continued advancing in the Pacific.", "result": "The US Navy halted that advance at Midway in June.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e160", "year": 1942.82, "title": "El Alamein", "person": "British and Axis forces", "category": "Wars", "story": "Axis forces had advanced into Egypt. British forces countered that advance.", "result": "Defeat at El Alamein forced Axis retreat across Libya.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e161", "year": 1943.08, "title": "Stalingrad surrender", "person": "Soviet forces", "category": "Wars", "story": "A Soviet counterattack surrounded Germany’s Sixth Army. Hitler forbade its retreat.", "result": "The trapped army surrendered in early 1943, a major reversal on the eastern front.", -dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e166", "year": 1945.35, "title": "Germany surrenders", "person": "Allied governments", "category": "Wars", "story": "Allied armies reached Germany and Soviet forces encircled Berlin.", "result": "Germany’s unconditional surrender took effect on 8 May; Moscow observed Victory Day on 9 May.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e167", "year": 1945.6, "title": "Hiroshima and Nagasaki", "person": "United States", "category": "Weapons", "story": "The Pacific war continued after Germany’s surrender. The United States used atomic bombs against two Japanese cities.", "result": "The bombings caused immense civilian harm; the Soviet Union also entered the war against Japan.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e168", "year": 1945.67, "title": "Japan formally surrenders", "person": "Japanese government", "category": "Treaties", "story": "Japan had agreed in principle to surrender in August. The formal signing followed.", "result": "The surrender on 2 September ended World War II.", "era": "Wars", "country": "Regional", "source": "https://encyclopedia.ushmm.org/content/en/article/world-war-ii-key-dates", "publisher": "US Holocaust Memorial Museum", "displayDate": ""}, {"id": "e169", "year": 1957, "title": "Sputnik 1", "person": "Soviet space programme", "category": "Science", "story": "Cold War competition extended into space. Engineers developed rockets able to put objects in orbit.", "result": "Sputnik 1 was the first artificial satellite.", "era": "Modern", "country": "Regional", "source": "https://www.britannica.com/story/timeline-of-the-space-race", "publisher": "Britannica s s+='</section>';}}
s+='<footer><p>'+(storageOK?'Progress saved only in this browser on this device.':'Storage unavailable. Progress lasts only while this page is open.')+'</p><small>Stage 1 · 519 selected sourced cards, not a complete history course. Dates can be approximate or ranges. BCE counts backwards toward CE. Timeline games order ranges by their starting anchor.</small><small>Your face, hair and colours come from the Arcade profile on this browser. Clothes are illustrative and do not reconstruct every culture. Robot art is original illustration. No ads, purchases or tracking.</small><small>Facts linked to museums, institutions and reference histories. Summaries are independently written. Source chronologies can differ; disputed interpretations need deeper study.</small></footer>';document.getElementById('app').innerHTML=s;outfit();}
